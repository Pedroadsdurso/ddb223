<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Desenrola Brasil</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Arial,Helvetica,sans-serif;background:#ececec;color:#1f3f93;overflow-x:hidden;}
    .page-wrapper{width:100%;min-height:100vh;overflow-x:hidden;}
    .hero-section{width:100%;background:#ddd;}
    .hero-image{width:100%;height:auto;display:block;}
    .content-card{width:calc(100% - 60px);max-width:690px;margin:14px auto 22px;background:#fff;border-radius:14px;padding:36px 24px 40px;text-align:center;}
    .logo-icon{width:80px;max-width:100%;display:block;margin:0 auto 8px;}
    .logo-text{width:320px;max-width:88%;display:block;margin:0 auto 26px;}
    .headline{font-size:19px;line-height:1.35;font-weight:700;color:#1d4fb4;margin-bottom:24px;}
    .subheadline{font-size:18px;line-height:1.35;color:#333;margin-bottom:26px;}
    .btn-actions-dual{display:flex;justify-content:center;align-items:center;gap:12px;width:100%;margin-bottom:20px;}
    .cta-button{display:inline-flex;align-items:center;justify-content:center;width:294px;max-width:100%;min-height:50px;padding:14px 28px;background:#2552b5;color:#fff;text-decoration:none;font-size:18px;font-weight:700;border-radius:999px;transition:opacity .2s ease;cursor:pointer;border:none;}
    .cta-button:hover{opacity:.92;}
    .btn-secondary-action{display:inline-flex;align-items:center;justify-content:center;padding:12px 24px;background:#f1f5f9;color:#475569;text-decoration:none;font-size:15px;font-weight:600;border-radius:999px;border:1px solid #cbd5e1;}
    .site-footer{margin-top:28px;padding-top:22px;border-top:1px solid #e5e7eb;text-align:center;}
    .footer-links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:16px;}
    .footer-links a{color:#2552b5;text-decoration:none;font-size:14px;font-weight:600;}
    .footer-links a:hover{text-decoration:underline;}
    .company-info{color:rgba(0,0,0,.22);font-size:13px;line-height:1.6;}
    .company-info strong{color:rgba(0,0,0,.28);}
    @media (max-width:768px){.content-card{width:calc(100% - 30px);padding:30px 20px 34px;}.logo-icon{width:72px;}.logo-text{width:290px;margin-bottom:22px;}.headline{font-size:17px;margin-bottom:20px;}.subheadline{font-size:17px;margin-bottom:24px;}.cta-button{width:280px;font-size:17px;}}
    @media (max-width:640px){.btn-actions-dual{display:flex !important;flex-direction:column !important;width:100% !important;gap:10px !important;}.btn-actions-dual .btn-primary-action,.btn-actions-dual .cta-button,.btn-actions-dual .cta{order:1 !important;width:100% !important;}.btn-actions-dual .btn-secondary-action{order:2 !important;width:100% !important;}}
    @media (max-width:480px){body{overflow-x:hidden;}.page-wrapper{padding:0 12px;box-sizing:border-box;}.content-card{width:calc(100% - 24px);margin:10px auto 16px;border-radius:12px;padding:28px 14px 30px;box-sizing:border-box;}.logo-icon{width:64px;margin-bottom:6px;}.logo-text{width:250px;max-width:92%;margin-bottom:18px;}.headline{font-size:15px;line-height:1.4;}.subheadline{font-size:15px;line-height:1.35;}.cta-button{width:100%;font-size:16px;min-height:48px;}.footer-links{gap:12px;}.footer-links a,.company-info{font-size:12px;}}
  </style>
</head>
<body>
  <main class="page-wrapper">
    <section class="hero-section">
      <img src="images/hero.png" alt="Pessoa segurando celular com tela de consulta" class="hero-image">
    </section>

    <section class="content-card">
      <img src="images/logo-icon.png" alt="&Iacute;cone Desenrola Brasil" class="logo-icon">
      <img src="images/logo-text.png" alt="Desenrola Brasil" class="logo-text">

      <h1 class="headline">
        O Programa Desenrola Brasil<br>
        possibilita a renegocia&ccedil;&atilde;o de d&iacute;vidas<br>
        com descontos de at&eacute; 99%
      </h1>

      <p class="subheadline">
        Clique no bot&atilde;o abaixo para<br>
        acessar a plataforma
      </p>

      <div class="btn-actions-dual">
        <a href="1/index.html" class="cta-button cta" data-destino="1/index.html">ACESSAR AGORA</a>
      </div>

      <footer class="site-footer">
        <div class="footer-links">
          <a href="https://melonne.netlify.app/politica-privacidade">Pol&iacute;tica de Privacidade</a>
          <a href="https://melonne.netlify.app/termos-de-uso">Termos de Uso</a>
          <a href="https://melonne.netlify.app/sobre-nos">Sobre N&oacute;s</a>
          <a href="https://melonne.netlify.app/cookies">Cookies</a>
        </div>
      </footer>
    </section>
  </main>

  <script src="site-config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
